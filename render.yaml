services:
  - type: web
    name: smartfood-ai-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: SMARTFOOD_DB
        value: /var/data/smartfood.sqlite3
      - key: SMARTFOOD_ALLOWED_HOSTS
        value: "*"
    disk:
      name: smartfood-data
      mountPath: /var/data
      sizeGB: 1
